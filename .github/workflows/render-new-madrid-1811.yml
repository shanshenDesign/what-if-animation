# House-style render for new-madrid-1811.
# GitHub only loads workflows from the repository root, so this is the runnable copy of
# new-madrid-1811/.github/workflows/render-video.yml (which is kept as the kit of record).
name: Render 3D Story Video (Kokoro am_fenrir + Remotion)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'new-madrid-1811/**'
      - '.github/workflows/render-new-madrid-1811.yml'

defaults:
  run:
    working-directory: new-madrid-1811

jobs:
  render-video:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python for free Kokoro TTS
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies for Chromium/WebGL & audio
        run: |
          set -euo pipefail
          sudo apt-get update
          # Ubuntu 24.04/26.04 renamed the time64 libraries (libasound2 -> libasound2t64, ...).
          # Pick the first name that actually exists in this runner's apt cache so the job
          # never dies on "Unable to locate package".
          pick() {
            for n in "$@"; do
              if apt-cache show "$n" >/dev/null 2>&1; then
                printf '%s ' "$n"
                return 0
              fi
            done
            echo "WARNING: none of these packages exist on this image: $*" >&2
          }
          PKGS=""
          for cand in \
            "ffmpeg" "xvfb" "mesa-utils" \
            "libnss3" "libnspr4" \
            "libpango-1.0-0" "libpangocairo-1.0-0" "libcairo2" \
            "libdrm2" "libxkbcommon0" "libxcomposite1" "libxdamage1" \
            "libxrandr2" "libgbm1" "libxfixes3" "libxshmfence1" \
            "libasound2t64 libasound2" \
            "libatk1.0-0t64 libatk1.0-0" \
            "libatk-bridge2.0-0t64 libatk-bridge2.0-0" \
            "libatspi2.0-0t64 libatspi2.0-0" \
            "libcups2t64 libcups2" \
            "libgtk-3-0t64 libgtk-3-0"
          do
            PKGS="$PKGS $(pick $cand)"
          done
          echo "Installing:$PKGS"
          sudo apt-get install -y $PKGS

      - name: Cache Kokoro model files (avoid 300 MB re-download)
        uses: actions/cache@v4
        with:
          path: |
            new-madrid-1811/scripts/kokoro-v1.0.onnx
            new-madrid-1811/scripts/voices-v1.0.bin
          key: kokoro-onnx-v1.0-am_fenrir

      - name: Install Node dependencies
        run: npm install

      - name: Install Kokoro TTS (free am_fenrir voice)
        run: |
          python -m pip install --upgrade pip
          pip install kokoro-onnx soundfile numpy

      - name: Generate voice-over with Kokoro (am_fenrir)
        run: |
          python scripts/generate_voiceover.py
          # Fail fast if the TTS step produced nothing to mux.
          test -s public/voiceover.wav
          python - <<'PY'
          import json, sys, wave
          d = json.load(open('src/sentence_times.json'))
          w = wave.open('public/voiceover.wav')
          dur = w.getnframes() / w.getframerate()
          ok = (d.get('hasAudio') is True and d.get('voice') == 'am_fenrir'
                and len(d.get('cuts', [])) == len(d.get('sentences', [])) + 1
                and abs(d['cuts'][-1] - dur) < 1.0 and dur > 20.0)
          print(f"voiceover.wav: {dur:.2f}s @ {w.getframerate()}Hz, cuts end {d['cuts'][-1]}s, hasAudio={d.get('hasAudio')}")
          sys.exit(0 if ok else 1)
          PY

      - name: Verify project & timing
        run: python scripts/verify_project.py

      - name: Render Remotion 9:16 3D/2D video
        run: |
          mkdir -p out
          xvfb-run -a npx remotion render src/index.jsx AnimatedStory out/full_silent.mp4 --gl=swangle --concurrency=2 --image-format=jpeg --jpeg-quality=92 --crf=17

      - name: Mux am_fenrir voice-over into final.mp4
        run: |
          npx remotion ffmpeg -y -i out/full_silent.mp4 -i public/voiceover.wav -map 0:v -map 1:a -c:v copy -c:a aac -b:a 192k -shortest out/final.mp4
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,width,height,r_frame_rate -of default=noprint_wrappers=1 out/final.mp4

      - name: Upload final.mp4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: new-madrid-1811-mp4
          path: new-madrid-1811/out/final.mp4
          retention-days: 14
