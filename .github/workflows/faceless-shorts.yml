name: Faceless Short (stick-story)

# Renders a pre-built faceless-shorts project from .opencode/skills/faceless-shorts/projects/<topic>/.
# Works two ways:
#   1. workflow_dispatch with topic = locked-doors-45s  → renders that project
#   2. push / manual run with no topic given      → picks the first project folder that exists in projects/
# `length` is the expected duration in seconds (metadata for the run); the real length always comes
# from the project's script.json. Any folder in projects/ works (heavy-shadows-35s, gravity-35s, ...).
# Pipeline on ubuntu-latest: Kokoro TTS (voice.py) → Whisper word alignment (words.py) →
# headless Chrome frame capture (tools/capture.mjs) → mix.py audio mix → .mp4 artifact.

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'Project folder name in .opencode/skills/faceless-shorts/projects/'
        required: false
        default: 'locked-doors-45s'
        type: string
      length:
        description: 'Expected length in seconds (informational; script.json is authoritative)'
        required: false
        default: '45'
        type: string
  push:
    paths:
      - '.opencode/skills/faceless-shorts/projects/**'
      - '.github/workflows/faceless-shorts.yml'

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve project folder
        id: proj
        run: |
          BASE=".opencode/skills/faceless-shorts/projects"
          TOPIC="${{ github.event.inputs.topic }}"
          DIR="$BASE/$TOPIC"
          if [ ! -f "$DIR/script.json" ]; then
            # fall back to the first pre-built project folder present in the repo
            DIR=""
            for d in "$BASE"/*/; do
              [ -f "$d/script.json" ] && DIR="${d%/}" && break
            done
          fi
          if [ -z "$DIR" ] || [ ! -f "$DIR/script.json" ]; then
            echo "::error::No ready-to-render project found in $BASE (topic='${TOPIC}')"
            exit 1
          fi
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$DIR")" >> "$GITHUB_OUTPUT"
          echo "length=${{ github.event.inputs.length }}" >> "$GITHUB_OUTPUT"
          echo "Rendering project: $DIR (expected length: ${{ github.event.inputs.length }}s)"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg + Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          if ! command -v google-chrome >/dev/null 2>&1 && ! command -v chromium-browser >/dev/null 2>&1; then
            curl -fsSL https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb -o /tmp/chrome.deb
            sudo apt-get install -y /tmp/chrome.deb
          fi
          google-chrome --version || chromium-browser --version

      - name: Install Python dependencies (Kokoro TTS + Whisper)
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy kokoro-onnx faster-whisper

      - name: Cache Kokoro + Whisper models
        uses: actions/cache@v4
        with:
          path: |
            ~/.faceless-shorts/kokoro
            ~/.cache/huggingface
            ~/.cache/whisper
          key: fs-models-${{ runner.os }}-v1

      - name: Copy project to workspace root
        run: cp -R "${{ steps.proj.outputs.dir }}" "./short-project"

      - name: Kokoro TTS (narration + line timings)
        working-directory: ./short-project
        run: python "$GITHUB_WORKSPACE/.opencode/skills/faceless-shorts/scripts/voice.py" .

      - name: Whisper word alignment
        working-directory: ./short-project
        run: python "$GITHUB_WORKSPACE/.opencode/skills/faceless-shorts/scripts/words.py" .

      - name: Capture check (Chrome boot + shots + captions)
        working-directory: ./short-project
        run: node tools/capture.mjs check

      - name: Export sound cues
        working-directory: ./short-project
        run: node tools/capture.mjs cues

      - name: QA contact sheet (frame every 0.5 s)
        working-directory: ./short-project
        run: node tools/capture.mjs sheet review/all.jpg 0.5 9

      - name: Mix audio (voice + ducked music bed + SFX)
        working-directory: ./short-project
        run: python tools/mix.py .

      - name: Render MP4 (Chrome frame capture + mix.wav)
        working-directory: ./short-project
        run: node tools/capture.mjs video "renders/${{ steps.proj.outputs.name }}.mp4"

      - name: Upload finished short (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.proj.outputs.name }}-mp4
          path: short-project/renders/${{ steps.proj.outputs.name }}.mp4
          if-no-files-found: error
          retention-days: 14

      - name: Upload contact sheet (QA)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.proj.outputs.name }}-sheet
          path: short-project/review/**
          if-no-files-found: ignore
          retention-days: 7
