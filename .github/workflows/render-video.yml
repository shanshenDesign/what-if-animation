name: Render What-If Video

on:
  workflow_dispatch:
    inputs:
      episode_slug:
        description: 'Episode slug (folder name in what-if-studio/src/episodes/)'
        required: true
        type: choice
        options:
          - pause-everyone
          - rewind
          - copy-paste
          - blackout-thirty
          - rome-electricity
      render_board:
        description: 'Render storyboard board instead of final episode'
        required: false
        type: boolean
        default: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: what-if-studio/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        working-directory: ./scripts
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install studio dependencies
        working-directory: ./what-if-studio
        run: npm ci

      - name: Determine composition ID
        id: compose
        run: |
          # Map slug to composition ID (PascalCase from episode.json "id" field)
          case "${{ inputs.episode_slug }}" in
            pause-everyone) composition_id="PauseEveryone" ;;
            rewind) composition_id="Rewind" ;;
            copy-paste) composition_id="CopyPaste" ;;
            blackout-thirty) composition_id="BlackoutThirty" ;;
            rome-electricity) composition_id="RomeElectricity" ;;
            *) echo "Unknown episode slug: ${{ inputs.episode_slug }}" && exit 1 ;;
          esac
          
          # If rendering board, append "Board" to composition ID
          if [ "${{ inputs.render_board }}" = "true" ]; then
            composition_id="${composition_id}Board"
          fi
          
          echo "composition_id=${composition_id}" >> $GITHUB_OUTPUT

      - name: Render MP4 video
        working-directory: ./what-if-studio
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          npx remotion render src/index.ts "${{ steps.compose.outputs.composition_id }}" out/${{ inputs.episode_slug }}-final.mp4 --log=error

      - name: Upload rendered MP4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.episode_slug }}-video
          path: what-if-studio/out/${{ inputs.episode_slug }}-final.mp4
          if-no-files-found: error
          retention-days: 7