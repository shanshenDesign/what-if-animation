name: Render What-If Video

on:
  workflow_dispatch:
    inputs:
      episode_id:
        description: 'Episode composition ID'
        required: true
        default: 'Main'

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: studio/package-lock.json

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install studio dependencies
        working-directory: ./studio
        run: npm ci

      - name: Render MP4 video
        working-directory: ./studio
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          EPISODE_ID: ${{ inputs.episode_id }}
        run: npx remotion render "$EPISODE_ID" out/final.mp4

      - name: Upload rendered MP4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: rendered-video
          path: studio/out/final.mp4
          if-no-files-found: error
